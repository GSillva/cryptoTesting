name: Cryptographic Testing without Docker

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "LibOQS algorithm index"
        required: true
        default: "17"
        type: string

jobs:
  crypto-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-tqdm \
            afl++ \
            which \
            zip

      - name: Prepare AFL++ compatibility directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aflpp"

          ln -sf "$(command -v afl-clang-fast)" \
            "$GITHUB_WORKSPACE/aflpp/afl-clang-fast"

          ln -sf "$(command -v afl-clang)" \
            "$GITHUB_WORKSPACE/aflpp/afl-clang"

          ln -sf "$(command -v afl-fuzz)" \
            "$GITHUB_WORKSPACE/aflpp/afl-fuzz"

      - name: Build LibOQS
        run: |
          make cur_liboqs

      - name: Prepare output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mvp"

      - name: Run Test 7
        run: |
          cd "$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c"

          echo "Running Test 7 with algorithm ${{ inputs.algorithm }}"

          DIRNAME=cur_liboqs make clean all

          export DESIRED_ALG_TO_FUZZ="${{ inputs.algorithm }}"
          export PYTHONPATH="$PWD"

          export AFL_PYTHON_MODULE=Maul
          export AFL_CUSTOM_MUTATOR_ONLY=1
          export AFL_SKIP_CPUFREQ=1
          export AFL_DISABLE_TRIM=1
          export AFL_EXIT_WHEN_DONE=1
          export AFL_EXIT_ON_TIME=1
          export AFL_DEBUG_CHILD=1
          export AFL_NO_UI=1
          export AFL_INPUT_LEN_MAX=100000000
          export AFL_TESTCACHE_SIZE=200
          export AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1

          rm -rf fuzzinputs
          rm -rf fuzzoutputs

          mkdir -p fuzzinputs

          make run_python

      - name: Inspect Test 7 output
        if: always()
        run: |
          echo "===== Test 7 output ====="

          find "$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c/fuzzoutputs" \
            -maxdepth 4 \
            -print 2>/dev/null | sort || true

          echo ""
          echo "===== fuzzinputs ====="

          find "$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c/fuzzinputs" \
            -maxdepth 3 \
            -print 2>/dev/null | sort || true

      - name: Package test results
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"

          zip -r crypto-testing-results.zip \
            tech/paper_fuzzing/liboqs/KEM/Decaps/c/fuzzoutputs \
            tech/paper_fuzzing/liboqs/KEM/Decaps/c/fuzzinputs \
            2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-results
          path: crypto-testing-results.zip
          if-no-files-found: warn
