
name: Cryptographic Testing without Docker

on:
  workflow_dispatch:
  push:
    branches:
      - github-actions-mvp
    paths:
      - ".github/workflows/crypto_testing_dock.yml"
      - "Makefile"
      - "tech/paper_fuzzing/liboqs/**"

permissions:
  contents: read

jobs:
  baseline:
    name: Test 7 baseline (LibOQS 0.8.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AFL++ and Python mutator dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            afl++ \
            build-essential \
            clang \
            git \
            libssl-dev \
            ninja-build \
            python3 \
            python3-bitarray \
            python3-cffi \
            python3-dev \
            python3-pip

          python3 - <<'PY'
          import cffi
          import bitarray
          print(f"cffi: {cffi.__version__}")
          print(f"bitarray: {bitarray.__version__}")
          PY

      - name: Prepare AFL++ compatibility paths
        shell: bash
        run: |
          set -Eeuo pipefail

          AFL_CC=""
          if command -v afl-clang-fast >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang-fast)"
          elif command -v afl-clang >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang)"
          elif command -v afl-cc >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-cc)"
          fi

          AFL_FUZZ="$(command -v afl-fuzz || true)"

          if [[ -z "$AFL_CC" ]]; then
            echo "::error::No AFL++ compiler wrapper found (afl-clang-fast, afl-clang or afl-cc)."
            exit 1
          fi
          if [[ -z "$AFL_FUZZ" ]]; then
            echo "::error::afl-fuzz was not found in PATH."
            exit 1
          fi

          mkdir -p aflpp
          ln -sfn "$AFL_CC" aflpp/afl-clang-fast
          ln -sfn "$AFL_FUZZ" aflpp/afl-fuzz

          echo "AFL compiler wrapper: $AFL_CC"
          echo "AFL fuzzer: $AFL_FUZZ"
          afl-fuzz -h 2>&1 | head -n 3 || true

      - name: Initialize baseline records
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p mvp/trials
          printf 'trial,started_at_utc,elapsed_seconds,make_exit_code,run_time,execs_done,execs_per_sec,cycles_done,paths_total,saved_crashes,saved_hangs\n' > mvp/timings.csv

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_commit=$(git rev-parse HEAD)"
            echo "branch=${GITHUB_REF_NAME:-unknown}"
            echo "runner_os=$(uname -srm)"
            echo "python=$(python3 --version 2>&1)"
            echo "clang=$(clang --version 2>&1 | head -n 1)"
            echo "--- CPU ---"
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name):' || true
            echo "--- Python mutator dependencies ---"
            python3 -c 'import cffi, bitarray; print("cffi=" + cffi.__version__); print("bitarray=" + bitarray.__version__)'
          } > mvp/environment.txt

      - name: Build LibOQS 0.8.0
        shell: bash
        run: |
          set -Eeuo pipefail
          make cur_liboqs
          {
            echo "liboqs_directory=cur_liboqs"
            echo "liboqs_commit=$(git -C cur_liboqs rev-parse HEAD)"
            echo "liboqs_description=$(git -C cur_liboqs describe --tags --always --dirty)"
          } >> mvp/environment.txt

      - name: Build Test 7 harness
        shell: bash
        run: |
          set -Eeuo pipefail
          HARNESS_DIR="tech/paper_fuzzing/liboqs/KEM/Decaps/c"
          make -C "$HARNESS_DIR" DIRNAME=cur_liboqs clean all

      - name: Run Test 7 baseline three times
        shell: bash
        run: |
          set -Eeuo pipefail

          HARNESS_DIR="$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c"

          read_stat() {
            local key="$1"
            local file="$2"
            if [[ ! -s "$file" ]]; then
              printf 'NA'
              return
            fi
            awk -F ':' -v wanted="$key" '
              {
                name = $1
                gsub(/^[ \t]+|[ \t]+$/, "", name)
                if (name == wanted) {
                  value = $2
                  gsub(/^[ \t]+|[ \t]+$/, "", value)
                  print value
                  found = 1
                  exit
                }
              }
              END { if (!found) print "NA" }
            ' "$file"
          }

          for trial in 1 2 3; do
            TRIAL_DIR="$GITHUB_WORKSPACE/mvp/trials/trial_${trial}"
            mkdir -p "$TRIAL_DIR"

            # Cada tentativa começa sem corpus ou estatísticas da anterior.
            rm -rf "$HARNESS_DIR/fuzzinputs" \
                   "$HARNESS_DIR/fuzzoutputs" \
                   "$HARNESS_DIR/crashes"

            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            start_ns="$(date +%s%N)"
            echo "Starting Test 7 trial ${trial}/3 at ${started_at}"

            set +e
            (
              cd "$HARNESS_DIR"
              make run_python \
                DESIRED_ALG_TO_FUZZ=17 \
                GITIMEOUT=10 \
                AFL_DEBUG_CHILD=1 \
                AFL_NO_UI=1 \
                'FUZZCMD=env -u AFL_EXIT_WHEN_DONE -u AFL_EXIT_ON_TIME $(AFLFUZZ) -i $(FUZZINPUTS)/ -o $(FUZZOUTPUTS) -V 30 -- $(BINDIR)/Match.afl.out @@'
            ) 2>&1 | tee "$TRIAL_DIR/run.log"
            make_status=${PIPESTATUS[0]}
            set -e

            end_ns="$(date +%s%N)"
            elapsed_seconds="$(awk -v start="$start_ns" -v end="$end_ns" 'BEGIN { printf "%.3f", (end - start) / 1000000000 }')"
            stats_file="$HARNESS_DIR/fuzzoutputs/default/fuzzer_stats"

            if [[ -s "$stats_file" ]]; then
              cp "$stats_file" "$TRIAL_DIR/fuzzer_stats"
            fi

            run_time="$(read_stat run_time "$stats_file")"
            execs_done="$(read_stat execs_done "$stats_file")"
            execs_per_sec="$(read_stat execs_per_sec "$stats_file")"
            cycles_done="$(read_stat cycles_done "$stats_file")"
            paths_total="$(read_stat paths_total "$stats_file")"
            saved_crashes="$(read_stat saved_crashes "$stats_file")"
            saved_hangs="$(read_stat saved_hangs "$stats_file")"

            printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' \
              "$trial" "$started_at" "$elapsed_seconds" "$make_status" \
              "$run_time" "$execs_done" "$execs_per_sec" "$cycles_done" \
              "$paths_total" "$saved_crashes" "$saved_hangs" \
              >> "$GITHUB_WORKSPACE/mvp/timings.csv"

            if [[ ! -s "$stats_file" ]]; then
              echo "::error::Trial ${trial} did not produce fuzzer_stats; AFL++ may have failed to start."
              exit 1
            fi

            if ! [[ "$execs_done" =~ ^[0-9]+$ ]] || (( execs_done < 1 )); then
              echo "::error::Trial ${trial} did not record any completed fuzzing executions."
              exit 1
            fi

            if (( make_status != 0 )); then
              echo "::error::make run_python returned ${make_status} in trial ${trial}."
              exit 1
            fi

            echo "Trial ${trial}: elapsed=${elapsed_seconds}s, execs_done=${execs_done}, execs_per_sec=${execs_per_sec}"
          done

      - name: Summarize baseline measurements
        if: always()
        shell: bash
        run: |
          if [[ -f mvp/timings.csv ]]; then
            echo "### Test 7 baseline timings" >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat mvp/timings.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat mvp/timings.csv
          else
            echo "No timing CSV was created." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload baseline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-baseline
          path: mvp/
          if-no-files-found: warn
          retention-days: 14
