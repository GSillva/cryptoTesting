name: Cryptographic Testing MVP

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "LibOQS algorithm index"
        required: true
        default: "17"
        type: string

jobs:
  crypto-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            python3 \
            python3-pip

      - name: Install Python dependency
        run: |
          python3 -m pip install --user tqdm

      - name: Build LibOQS
        run: |
          make cur_liboqs

      - name: Build AFL++
        run: |
          make aflpp

      - name: Prepare output directory
        run: |
          mkdir -p mvp

      - name: Run Test 7
        run: |
          set +e

          cd tech/paper_fuzzing/liboqs/KEM/Decaps/c

          DIRNAME=cur_liboqs make clean all

          time python3 run_all.py \
            --mutator python \
            --run_specific_alg_only ${{ inputs.algorithm }} \
            --base_path mvp

          STATUS=$?

          echo "Test 7 exit code: $STATUS"

          exit $STATUS

      - name: Inspect Test 7 output
        if: always()
        run: |
          echo "===== ARQUIVOS GERADOS ====="
          find mvp -maxdepth 5 -print | sort || true

          echo ""
          echo "===== stdout.txt ====="
          cat "mvp/${{ inputs.algorithm }}/stdout.txt" || true

          echo ""
          echo "===== fuzzoutputs ====="
          find "mvp/${{ inputs.algorithm }}/fuzzoutputs" \
            -maxdepth 3 \
            -print 2>/dev/null | sort || true

      - name: Package test results
        if: always()
        run: |
          zip -r crypto-testing-results.zip mvp/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-results
          path: crypto-testing-results.zip
          if-no-files-found: warn
