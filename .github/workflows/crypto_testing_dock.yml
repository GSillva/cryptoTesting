
name: Cryptographic Testing without Docker

on:
  workflow_dispatch:
  push:
    branches:
      - github-actions-mvp
    paths:
      - ".github/workflows/crypto_testing_dock.yml"
      - "Makefile"
      - "tech/paper_fuzzing/liboqs/**"

permissions:
  contents: read

jobs:
  baseline:
    name: Test 7 baseline (LibOQS 0.8.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            afl++ \
            build-essential \
            clang \
            cmake \
            git \
            libssl-dev \
            ninja-build \
            python3 \
            python3-bitarray \
            python3-cffi \
            python3-dev \
            python3-pip

          python3 - <<'PY'
          import cffi
          import bitarray
          print("cffi:", cffi.__version__)
          print("bitarray:", bitarray.__version__)
          PY

      - name: Prepare AFL++ compatibility paths
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v afl-clang-fast >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang-fast)"
          elif command -v afl-clang >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang)"
          elif command -v afl-cc >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-cc)"
          else
            echo "::error::No AFL++ compiler wrapper found."
            exit 1
          fi

          AFL_FUZZ="$(command -v afl-fuzz)"
          mkdir -p aflpp
          ln -sfn "$AFL_CC" aflpp/afl-clang-fast
          ln -sfn "$AFL_CC" aflpp/afl-clang
          ln -sfn "$AFL_FUZZ" aflpp/afl-fuzz

          echo "AFL compiler: $AFL_CC"
          echo "AFL fuzzer: $AFL_FUZZ"

      - name: Initialize baseline records
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p mvp/trials

          printf 'trial,started_at_utc,elapsed_seconds,make_exit_code,run_time,execs_done,execs_per_sec,cycles_done,paths_total,saved_crashes,saved_hangs\n' \
            > mvp/timings.csv

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_commit=$(git rev-parse HEAD)"
            echo "branch=${GITHUB_REF_NAME:-unknown}"
            echo "runner_os=$(uname -srm)"
            echo "python=$(python3 --version 2>&1)"
            echo "afl_version=$(afl-fuzz -h 2>&1 | head -n 1 || true)"
            python3 -c 'import cffi, bitarray; print("cffi=" + cffi.__version__); print("bitarray=" + bitarray.__version__)'
          } > mvp/environment.txt

      - name: Build LibOQS 0.8.0
        shell: bash
        run: |
          set -Eeuo pipefail
          make cur_liboqs

          {
            echo "liboqs_directory=cur_liboqs"
            if [[ -d cur_liboqs/.git ]]; then
              echo "liboqs_commit=$(git -C cur_liboqs rev-parse HEAD)"
              echo "liboqs_description=$(git -C cur_liboqs describe --tags --always --dirty)"
            fi
          } >> mvp/environment.txt

      - name: Build Test 7 harness
        shell: bash
        run: |
          set -Eeuo pipefail
          HARNESS_DIR="tech/paper_fuzzing/liboqs/KEM/Decaps/c"
          make -C "$HARNESS_DIR" DIRNAME=cur_liboqs clean all

      - name: Run Test 7 baseline three times
        shell: bash
        run: |
          set -Eeuo pipefail

          HARNESS_DIR="$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c"

          read_stat() {
            local key="$1"
            local file="$2"

            [[ -s "$file" ]] || { printf 'NA'; return; }

            awk -F ':' -v wanted="$key" '
              {
                name = $1
                gsub(/^[ \t]+|[ \t]+$/, "", name)
                if (name == wanted) {
                  value = $2
                  gsub(/^[ \t]+|[ \t]+$/, "", value)
                  print value
                  found = 1
                  exit
                }
              }
              END { if (!found) print "NA" }
            ' "$file"
          }

          for trial in 1 2 3; do
            TRIAL_DIR="$GITHUB_WORKSPACE/mvp/trials/trial_${trial}"
            mkdir -p "$TRIAL_DIR"

            rm -rf "$HARNESS_DIR/fuzzinputs" \
                   "$HARNESS_DIR/fuzzoutputs" \
                   "$HARNESS_DIR/crashes"

            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            start_ns="$(date +%s%N)"

            echo "Starting Test 7 trial ${trial}/3"

            set +e
            (
              cd "$HARNESS_DIR"

              export DESIRED_ALG_TO_FUZZ=17
              export PYTHONPATH="$GITHUB_WORKSPACE"
              export AFL_PYTHON_MODULE=Maul
              export AFL_CUSTOM_MUTATOR_ONLY=1
              export AFL_SKIP_CPUFREQ=1
              export AFL_DISABLE_TRIM=1
              export AFL_NO_UI=1
              export AFL_DEBUG_CHILD=1
              export AFL_INPUT_LEN_MAX=100000000
              export AFL_TESTCACHE_SIZE=200

              make run_python \
                'FUZZCMD=env -u AFL_EXIT_WHEN_DONE -u AFL_EXIT_ON_TIME AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 $(AFLFUZZ) -i $(FUZZINPUTS)/ -o $(FUZZOUTPUTS) -V 30 -- $(BINDIR)/Match.afl.out @@'
            ) 2>&1 | tee "$TRIAL_DIR/run.log"

            make_status=${PIPESTATUS[0]}
            set -e

            end_ns="$(date +%s%N)"
            elapsed_seconds="$(awk -v s="$start_ns" -v e="$end_ns" 'BEGIN { printf "%.3f", (e-s)/1000000000 }')"

            stats_file="$HARNESS_DIR/fuzzoutputs/default/fuzzer_stats"

            if [[ -s "$stats_file" ]]; then
              cp "$stats_file" "$TRIAL_DIR/fuzzer_stats"
            fi

            run_time="$(read_stat run_time "$stats_file")"
            execs_done="$(read_stat execs_done "$stats_file")"
            execs_per_sec="$(read_stat execs_per_sec "$stats_file")"
            cycles_done="$(read_stat cycles_done "$stats_file")"
            paths_total="$(read_stat paths_total "$stats_file")"
            saved_crashes="$(read_stat saved_crashes "$stats_file")"
            saved_hangs="$(read_stat saved_hangs "$stats_file")"

            printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' \
              "$trial" "$started_at" "$elapsed_seconds" "$make_status" \
              "$run_time" "$execs_done" "$execs_per_sec" "$cycles_done" \
              "$paths_total" "$saved_crashes" "$saved_hangs" \
              >> "$GITHUB_WORKSPACE/mvp/timings.csv"

            if [[ ! -s "$stats_file" ]]; then
              echo "::error::Trial ${trial} did not produce fuzzer_stats."
              exit 1
            fi

            if ! [[ "$execs_done" =~ ^[0-9]+$ ]] || (( execs_done < 1 )); then
              echo "::error::Trial ${trial} recorded no completed executions."
              exit 1
            fi

            if (( make_status != 0 )); then
              echo "::error::make run_python failed in trial ${trial}."
              exit 1
            fi

            echo "Trial ${trial}: ${elapsed_seconds}s, executions=${execs_done}, execs/sec=${execs_per_sec}"
          done

      - name: Summarize baseline measurements
        if: always()
        shell: bash
        run: |
          if [[ -f mvp/timings.csv ]]; then
            {
              echo "### Test 7 baseline"
              echo '```csv'
              cat mvp/timings.csv
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            cat mvp/timings.csv
          else
            echo "No timing CSV was created." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload baseline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-baseline
          path: mvp/
          if-no-files-found: warn
          retention-days: 14
