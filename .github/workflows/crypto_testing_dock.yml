name: Cryptographic Testing without Docker

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "LibOQS algorithm index"
        required: true
        default: "17"
        type: string

jobs:
  crypto-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-tqdm \
            afl++ \
            which \
            zip

      - name: Verify tools
        run: |
          echo "===== GCC ====="
          gcc --version

          echo ""
          echo "===== CMake ====="
          cmake --version

          echo ""
          echo "===== Python ====="
          python3 --version

          echo ""
          echo "===== AFL++ ====="
          command -v afl-cc
          command -v afl-clang-fast
          command -v afl-clang
          command -v afl-fuzz

          echo ""
          echo "===== AFL++ version ====="
          afl-fuzz --version || true

      - name: Prepare AFL++ compatibility directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aflpp"

          ln -sf "$(command -v afl-clang-fast)" \
            "$GITHUB_WORKSPACE/aflpp/afl-clang-fast"

          ln -sf "$(command -v afl-clang)" \
            "$GITHUB_WORKSPACE/aflpp/afl-clang"

          ln -sf "$(command -v afl-fuzz)" \
            "$GITHUB_WORKSPACE/aflpp/afl-fuzz"

          echo "===== AFL++ compatibility directory ====="
          ls -lah "$GITHUB_WORKSPACE/aflpp"

          echo ""
          echo "===== Resolved links ====="
          readlink -f "$GITHUB_WORKSPACE/aflpp/afl-clang-fast"
          readlink -f "$GITHUB_WORKSPACE/aflpp/afl-clang"
          readlink -f "$GITHUB_WORKSPACE/aflpp/afl-fuzz"

      - name: Build LibOQS
        run: |
          make cur_liboqs

      - name: Prepare output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mvp"

      - name: Inspect AFL++ paths expected by Makefile
        run: |
          cd "$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c"

          echo "===== ROOTDIR ====="
          echo "../../../../../../"

          echo ""
          echo "===== AFL++ files expected by Makefile ====="
          ls -l \
            "$GITHUB_WORKSPACE/aflpp/afl-clang-fast" \
            "$GITHUB_WORKSPACE/aflpp/afl-clang" \
            "$GITHUB_WORKSPACE/aflpp/afl-fuzz"

            - name: Debug AFL++ Test 7
        run: |
          cd "$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c"

          echo "===== Working directory ====="
          pwd

          echo ""
          echo "===== DESIRED ALGORITHM ====="
          echo "${{ inputs.algorithm }}"

          echo ""
          echo "===== AFL++ binaries ====="
          ls -l "$GITHUB_WORKSPACE/aflpp/afl-clang-fast"
          ls -l "$GITHUB_WORKSPACE/aflpp/afl-fuzz"

          echo ""
          echo "===== Build harness ====="
          DIRNAME=cur_liboqs make clean all

          echo ""
          echo "===== Prepare algorithm ====="

          export DESIRED_ALG_TO_FUZZ="${{ inputs.algorithm }}"
          export PYTHONPATH="$PWD"

          export AFL_PYTHON_MODULE=Maul
          export AFL_CUSTOM_MUTATOR_ONLY=1
          export AFL_SKIP_CPUFREQ=1
          export AFL_DISABLE_TRIM=1
          export AFL_EXIT_WHEN_DONE=1
          export AFL_EXIT_ON_TIME=1
          export AFL_DEBUG_CHILD=1
          export AFL_NO_UI=1
          export AFL_INPUT_LEN_MAX=100000000
          export AFL_TESTCACHE_SIZE=200
          export AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1

          echo "DESIRED_ALG_TO_FUZZ=$DESIRED_ALG_TO_FUZZ"
          echo "PYTHONPATH=$PYTHONPATH"
          echo "AFL_PYTHON_MODULE=$AFL_PYTHON_MODULE"

          echo ""
          echo "===== Removing previous AFL output ====="

          rm -rf fuzzinputs
          rm -rf fuzzoutputs
          mkdir -p fuzzinputs

          echo ""
          echo "===== Running make run_python directly ====="

          set +e

          make run_python 2>&1 | tee "$GITHUB_WORKSPACE/afl-direct.log"

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "===== make run_python exit code ====="
          echo "$STATUS"

          echo ""
          echo "===== Directory tree after AFL++ ====="
          find fuzzoutputs -maxdepth 4 -print 2>/dev/null | sort || true

          echo ""
          echo "===== fuzzinputs ====="
          find fuzzinputs -maxdepth 3 -print 2>/dev/null | sort || true

          echo ""
          echo "===== AFL direct log ====="
          cat "$GITHUB_WORKSPACE/afl-direct.log" || true

          exit 0

      - name: Inspect Test 7 output
        if: always()
        run: |
          echo "===== ARQUIVOS GERADOS ====="

          find "$GITHUB_WORKSPACE/mvp" \
            -maxdepth 5 \
            -print | sort || true

          echo ""
          echo "===== stdout.txt ====="

          cat "$GITHUB_WORKSPACE/mvp/${{ inputs.algorithm }}/stdout.txt" || true

          echo ""
          echo "===== fuzzoutputs ====="

          find "$GITHUB_WORKSPACE/mvp/${{ inputs.algorithm }}/fuzzoutputs" \
            -maxdepth 3 \
            -print 2>/dev/null | sort || true

      - name: Package test results
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mvp"

          zip -r crypto-testing-results.zip mvp/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-results
          path: crypto-testing-results.zip
          if-no-files-found: warn
