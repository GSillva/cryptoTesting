name: Cryptographic Testing without Docker

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "LibOQS algorithm index"
        required: true
        default: "17"
        type: string

jobs:
  crypto-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-tqdm \
            afl++ \
            which \
            zip

      - name: Verify tools
        run: |
          echo "===== GCC ====="
          gcc --version

          echo ""
          echo "===== CMake ====="
          cmake --version

          echo ""
          echo "===== Python ====="
          python3 --version

          echo ""
          echo "===== AFL++ ====="
          command -v afl-fuzz
          afl-fuzz --version || true

          echo ""
          echo "AFL++ available."

      - name: Check AFL++ compilers
        run: |
          echo "===== AFL++ executables ====="

          command -v afl-cc || true
          command -v afl-c++ || true
          command -v afl-gcc || true
          command -v afl-gcc-fast || true
          command -v afl-clang || true
          command -v afl-clang-fast || true

          echo ""
          echo "===== afl-cc version ====="
          afl-cc --version || true

      - name: Check AFL++ detection
        run: |
          echo "===== which ====="
          which afl-cc
          which afl-gcc
          which afl-fuzz

          echo ""
          echo "===== command -v ====="
          command -v afl-cc
          command -v afl-gcc
          command -v afl-fuzz

      - name: Build LibOQS
        run: |
          make cur_liboqs

      - name: Prepare output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mvp"

      - name: Run Test 7
        run: |
          cd "$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c"

          AFLCC=afl-cc \
          AFLGCC=afl-gcc \
          DIRNAME=cur_liboqs \
          make clean all

          set +e

          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 \
          time python3 run_all.py \
            --mutator python \
            --run_specific_alg_only "${{ inputs.algorithm }}" \
            --base_path "$GITHUB_WORKSPACE/mvp"

          STATUS=$?

          echo "Test 7 exit code: $STATUS"

          exit $STATUS

      - name: Inspect Test 7 output
        if: always()
        run: |
          echo "===== ARQUIVOS GERADOS ====="

          find "$GITHUB_WORKSPACE/mvp" \
            -maxdepth 5 \
            -print | sort || true

          echo ""
          echo "===== stdout.txt ====="

          cat "$GITHUB_WORKSPACE/mvp/${{ inputs.algorithm }}/stdout.txt" || true

          echo ""
          echo "===== fuzzoutputs ====="

          find "$GITHUB_WORKSPACE/mvp/${{ inputs.algorithm }}/fuzzoutputs" \
            -maxdepth 3 \
            -print 2>/dev/null | sort || true

      - name: Package test results
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mvp"

          zip -r crypto-testing-results.zip mvp/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-results
          path: crypto-testing-results.zip
          if-no-files-found: warn
