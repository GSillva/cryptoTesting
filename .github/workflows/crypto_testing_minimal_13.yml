
name: Crypto Testing - Selectable LibOQS Tests

on:
  workflow_dispatch:
    inputs:
      all_tests:
        description: "Run all 13 tests if no individual test is selected"
        required: false
        type: boolean
        default: true
      kem_decaps_c:
        description: "Test 7 - KEM/Decaps/c"
        type: boolean
        required: false
        default: false
      kem_decaps_sk:
        description: "Test 6 - KEM/Decaps/sk"
        type: boolean
        required: false
        default: false
      kem_encaps_badrng:
        description: "Test 5 - KEM/Encaps/badrng"
        type: boolean
        required: false
        default: false
      kem_encaps_pk_0:
        description: "Test 3 - KEM/Encaps/pk-0"
        type: boolean
        required: false
        default: false
      kem_encaps_pk:
        description: "Test 4 - KEM/Encaps/pk"
        type: boolean
        required: false
        default: false
      kem_keygen_badrng:
        description: "Test 2 - KEM/Keygen/badrng"
        type: boolean
        required: false
        default: false
      sign_keygen_badrng:
        description: "Test 2 - SIGN/Keygen/badrng"
        type: boolean
        required: false
        default: false
      sign_sign_badrng:
        description: "Test 10 - SIGN/Sign/badrng"
        type: boolean
        required: false
        default: false
      sign_sign_m:
        description: "Test 9 - SIGN/Sign/m"
        type: boolean
        required: false
        default: false
      sign_sign_sk:
        description: "Test 8 - SIGN/Sign/sk"
        type: boolean
        required: false
        default: false
      sign_verify_m:
        description: "Test 12 - SIGN/Verify/m"
        type: boolean
        required: false
        default: false
      sign_verify_sig:
        description: "Test 13 - SIGN/Verify/sig"
        type: boolean
        required: false
        default: false
      sign_verify_pk:
        description: "Test 11 - SIGN/Verify/pk"
        type: boolean
        required: false
        default: false

  push:
    branches:
      - master
    paths:
      - ".github/workflows/crypto_testing_selectable.yml"
      - "Makefile"
      - "fuzz_liboqs.py"
      - "tech/paper_fuzzing/liboqs/**"
      - "tech/paper_fuzzing/utilities/**"

permissions:
  contents: read

jobs:
  liboqs-tests:
    name: Selected LibOQS fuzzing tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      LIBOQS_DIR: cur_liboqs
      AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
      AFL_SKIP_CPUFREQ: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            afl++ \
            build-essential \
            clang \
            cmake \
            git \
            libssl-dev \
            ninja-build \
            python3 \
            python3-bitarray \
            python3-cffi \
            python3-dev \
            python3-psutil \
            python3-tqdm

      - name: Prepare AFL++ compatibility paths
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v afl-clang-fast >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang-fast)"
          elif command -v afl-clang >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang)"
          elif command -v afl-cc >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-cc)"
          else
            echo "::error::AFL++ compiler wrapper not found"
            exit 1
          fi

          AFL_FUZZ="$(command -v afl-fuzz)"
          mkdir -p aflpp
          ln -sfn "$AFL_CC" aflpp/afl-clang-fast
          ln -sfn "$AFL_CC" aflpp/afl-clang
          ln -sfn "$AFL_FUZZ" aflpp/afl-fuzz

      - name: Build LibOQS 0.8.0
        shell: bash
        run: |
          set -Eeuo pipefail

          git clone --depth 1 --branch 0.8.0 \
            https://github.com/open-quantum-safe/liboqs.git "$LIBOQS_DIR"

          cmake -S "$LIBOQS_DIR" -B "$LIBOQS_DIR/build" -GNinja \
            -DOQS_BUILD_TESTS=OFF \
            -DOQS_BUILD_EXAMPLES=OFF

          cmake --build "$LIBOQS_DIR/build" --parallel 2

          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/$LIBOQS_DIR/build/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Resolve selected tests
        shell: bash
        env:
          ALL_TESTS: ${{ inputs.all_tests }}
          KEM_DECAPS_C: ${{ inputs.kem_decaps_c }}
          KEM_DECAPS_SK: ${{ inputs.kem_decaps_sk }}
          KEM_ENCAPS_BADRNG: ${{ inputs.kem_encaps_badrng }}
          KEM_ENCAPS_PK_0: ${{ inputs.kem_encaps_pk_0 }}
          KEM_ENCAPS_PK: ${{ inputs.kem_encaps_pk }}
          KEM_KEYGEN_BADRNG: ${{ inputs.kem_keygen_badrng }}
          SIGN_KEYGEN_BADRNG: ${{ inputs.sign_keygen_badrng }}
          SIGN_SIGN_BADRNG: ${{ inputs.sign_sign_badrng }}
          SIGN_SIGN_M: ${{ inputs.sign_sign_m }}
          SIGN_SIGN_SK: ${{ inputs.sign_sign_sk }}
          SIGN_VERIFY_M: ${{ inputs.sign_verify_m }}
          SIGN_VERIFY_SIG: ${{ inputs.sign_verify_sig }}
          SIGN_VERIFY_PK: ${{ inputs.sign_verify_pk }}
        run: |
          set -Eeuo pipefail

          selected=()

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            selected=("ALL")
          else
            [[ "${KEM_DECAPS_C,,}" == "true" ]] && selected+=("KEM/Decaps/c")
            [[ "${KEM_DECAPS_SK,,}" == "true" ]] && selected+=("KEM/Decaps/sk")
            [[ "${KEM_ENCAPS_BADRNG,,}" == "true" ]] && selected+=("KEM/Encaps/badrng")
            [[ "${KEM_ENCAPS_PK_0,,}" == "true" ]] && selected+=("KEM/Encaps/pk-0")
            [[ "${KEM_ENCAPS_PK,,}" == "true" ]] && selected+=("KEM/Encaps/pk")
            [[ "${KEM_KEYGEN_BADRNG,,}" == "true" ]] && selected+=("KEM/Keygen/badrng")
            [[ "${SIGN_KEYGEN_BADRNG,,}" == "true" ]] && selected+=("SIGN/Keygen/badrng")
            [[ "${SIGN_SIGN_BADRNG,,}" == "true" ]] && selected+=("SIGN/Sign/badrng")
            [[ "${SIGN_SIGN_M,,}" == "true" ]] && selected+=("SIGN/Sign/m")
            [[ "${SIGN_SIGN_SK,,}" == "true" ]] && selected+=("SIGN/Sign/sk")
            [[ "${SIGN_VERIFY_M,,}" == "true" ]] && selected+=("SIGN/Verify/m")
            [[ "${SIGN_VERIFY_SIG,,}" == "true" ]] && selected+=("SIGN/Verify/sig")
            [[ "${SIGN_VERIFY_PK,,}" == "true" ]] && selected+=("SIGN/Verify/pk")

            if ((${#selected[@]} == 0)); then
              if [[ "${ALL_TESTS,,}" == "true" ]]; then
                selected=("ALL")
              else
                echo "::error::Select at least one test or enable all_tests"
                exit 1
              fi
            fi
          fi

          selection="$(IFS=,; echo "${selected[*]}")"
          echo "CI_SELECTED_TESTS=$selection" >> "$GITHUB_ENV"

          {
            echo "### Selected tests"
            printf -- '- `%s`\n' "${selected[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply runner-only compatibility adjustments
        shell: bash
        run: |
          set -Eeuo pipefail

          # Remove an unused import in the runner workspace only.
          if [[ -f tech/paper_fuzzing/liboqs/serialize.py ]]; then
            sed -i '/^from sympy import false$/d' \
              tech/paper_fuzzing/liboqs/serialize.py
          fi

          # Adjust the AFL++ command in the temporary Makefiles.
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          makefiles = sorted(
              list(Path("tech/paper_fuzzing/liboqs/KEM").rglob("Makefile"))
              + list(Path("tech/paper_fuzzing/liboqs/SIGN").rglob("Makefile"))
          )

          if len(makefiles) != 13:
              sys.exit(f"Expected 13 test Makefiles; found {len(makefiles)}")

          for path in makefiles:
              source = path.read_text()
              lines = source.splitlines()
              indexes = [
                  i for i, line in enumerate(lines)
                  if line.startswith("FUZZCMD=")
              ]

              if len(indexes) != 1:
                  sys.exit(f"Expected one FUZZCMD line in {path}")

              i = indexes[0]
              line = re.sub(r"(?<!\S)-D(?=\s)", "", lines[i])
              line = line.replace(
                  "FUZZCMD=",
                  "FUZZCMD=env -u AFL_EXIT_WHEN_DONE -u AFL_EXIT_ON_TIME "
                  "AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 ",
                  1,
              )
              lines[i] = line
              path.write_text("\n".join(lines) + "\n")

          # Guarantee at least one worker.
          path = Path("fuzz_liboqs.py")
          source = path.read_text()
          old = "nproc = int(0.8 * psutil.cpu_count(logical=False)) - 1"
          new = "nproc = max(1, int(0.8 * (psutil.cpu_count(logical=True) or 1)) - 1)"

          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source)

          # Safely find the TESTPATHS assignment, including indented assignments.
          # Do not assume it is at the top level.
          import ast

          tree = ast.parse(source)
          assignments = []

          for node in ast.walk(tree):
              targets = []
              if isinstance(node, ast.Assign):
                  targets = node.targets
              elif isinstance(node, ast.AnnAssign):
                  targets = [node.target]

              if any(
                  isinstance(target, ast.Name) and target.id == "TESTPATHS"
                  for target in targets
              ):
                  assignments.append(node)

          if len(assignments) != 1:
              sys.exit(
                  f"Expected exactly one TESTPATHS assignment; found {len(assignments)}"
              )

          node = assignments[0]
          if not isinstance(node, (ast.Assign, ast.AnnAssign)):
              sys.exit("Unsupported TESTPATHS assignment")

          print(
              f"Located TESTPATHS at lines "
              f"{node.lineno}-{getattr(node, 'end_lineno', node.lineno)}"
          )

          # Replace the assigned list expression with a filtered expression.
          # Keep the original list intact and evaluate its elements normally.
          start_line = node.lineno - 1
          end_line = getattr(node, "end_lineno", node.lineno)
          lines = source.splitlines()

          original = "\n".join(lines[start_line:end_line])
          if "TESTPATHS" not in original:
              sys.exit("Unexpected TESTPATHS assignment")

          # Insert filtering code immediately after the assignment.
          injection = [
              "",
              "# CI test selection; runner workspace only.",
              "import os as _ci_os",
              "_ci_selected = [",
              "    item for item in _ci_os.environ.get('CI_SELECTED_TESTS', 'ALL').split(',')",
              "    if item",
              "]",
              "if _ci_selected != ['ALL']:",
              "    def _ci_norm(value):",
              "        return str(value).replace(chr(92), '/').rstrip('/')",
              "    def _ci_match(value, suffix):",
              "        value = _ci_norm(value)",
              "        return value == suffix or value.endswith('/' + suffix)",
              "    _ci_missing = [",
              "        suffix for suffix in _ci_selected",
              "        if not any(_ci_match(path, suffix) for path in TESTPATHS)",
              "    ]",
              "    if _ci_missing:",
              "        raise RuntimeError('Unknown test selection(s): ' + ', '.join(_ci_missing))",
              "    TESTPATHS = [",
              "        path for path in TESTPATHS",
              "        if any(_ci_match(path, suffix) for suffix in _ci_selected)",
              "    ]",
              "print('Selected TESTPATHS:', TESTPATHS)",
          ]

          lines[end_line:end_line] = injection
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Run selected tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 fuzz_liboqs.py \
            --liboqs "$LIBOQS_DIR" \
            --mutator python \
            --logfile "${LIBOQS_DIR}.log"

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-selected-results
          path: |
            cur_liboqs.log
            tech/paper_fuzzing/liboqs/**/aggr_*
          if-no-files-found: warn
          retention-days: 14
