
name: Cryptographic Testing - Optimization Benchmark
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/crypto_testing_dock.yml"
      - "Makefile"
      - "tech/paper_fuzzing/liboqs/**"

permissions:
  contents: read

jobs:
  optimization-comparison:
    name: Test 7 - default vs LibOQS -O2
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            afl++ \
            build-essential \
            clang \
            cmake \
            git \
            libssl-dev \
            ninja-build \
            python3 \
            python3-bitarray \
            python3-cffi \
            python3-dev \
            python3-pip \
            python3-sympy

          python3 - <<'PY'
          import cffi
          import bitarray
          import sympy
          print("cffi:", cffi.__version__)
          print("bitarray:", bitarray.__version__)
          print("sympy:", sympy.__version__)
          PY

      - name: Prepare AFL++ compatibility paths
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v afl-clang-fast >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang-fast)"
          elif command -v afl-clang >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang)"
          elif command -v afl-cc >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-cc)"
          else
            echo "::error::No AFL++ compiler wrapper found."
            exit 1
          fi

          AFL_FUZZ="$(command -v afl-fuzz || true)"
          if [[ -z "$AFL_FUZZ" ]]; then
            echo "::error::afl-fuzz was not found in PATH."
            exit 1
          fi

          mkdir -p aflpp
          ln -sfn "$AFL_CC" aflpp/afl-clang-fast
          ln -sfn "$AFL_CC" aflpp/afl-clang
          ln -sfn "$AFL_FUZZ" aflpp/afl-fuzz

          echo "AFL compiler: $AFL_CC"
          echo "AFL fuzzer: $AFL_FUZZ"
          afl-fuzz -h 2>&1 | head -n 3 || true

      - name: Build baseline LibOQS 0.8.0 (repository defaults)
        shell: bash
        run: |
          set -Eeuo pipefail
          make cur_liboqs

          {
            echo "baseline_liboqs_commit=$(git -C cur_liboqs rev-parse HEAD)"
            echo "baseline_liboqs_tag=$(git -C cur_liboqs describe --tags --always)"
            grep -E '^CMAKE_(BUILD_TYPE|C_FLAGS):STRING=' cur_liboqs/build/CMakeCache.txt || true
          } > /tmp/baseline-build-info.txt

      - name: Build comparison LibOQS 0.8.0 with C flags -O2
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone https://github.com/open-quantum-safe/liboqs.git cur_liboqs_opt
          git -C cur_liboqs_opt checkout 0.8.0

          cmake -S cur_liboqs_opt -B cur_liboqs_opt/build -GNinja \
            -DCMAKE_C_FLAGS=-O2 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C cur_liboqs_opt/build

          baseline_commit="$(git -C cur_liboqs rev-parse HEAD)"
          optimized_commit="$(git -C cur_liboqs_opt rev-parse HEAD)"
          if [[ "$baseline_commit" != "$optimized_commit" ]]; then
            echo "::error::Baseline and optimized LibOQS checkouts do not point to the same commit."
            echo "baseline=$baseline_commit"
            echo "optimized=$optimized_commit"
            exit 1
          fi

          {
            echo "optimized_liboqs_commit=$(git -C cur_liboqs_opt rev-parse HEAD)"
            echo "optimized_liboqs_tag=$(git -C cur_liboqs_opt describe --tags --always)"
            grep -E '^CMAKE_(BUILD_TYPE|C_FLAGS):STRING=' cur_liboqs_opt/build/CMakeCache.txt || true
          } > /tmp/optimized-build-info.txt

      - name: Initialize experiment records
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p mvp/experiments/baseline mvp/experiments/optimized

          printf 'pair,order,variant,trial,started_at_utc,wall_elapsed_seconds,make_exit_code,mutator_loaded,completion_marker,last_debug_progress,total_bit_positions,afl_reported_seconds,stats_snapshot_execs_done,saved_crashes,saved_hangs\n' \
            > mvp/timings.csv

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_commit=$(git rev-parse HEAD)"
            echo "branch=${GITHUB_REF_NAME:-unknown}"
            echo "runner_os=$(uname -srm)"
            echo "python=$(python3 --version 2>&1)"
            echo "afl_version=$(afl-fuzz -h 2>&1 | head -n 1 || true)"
            echo "test=Test 7: Decaps(sk, Maul(c))"
            echo "algorithm_index=17"
            echo "liboqs_version=0.8.0"
            echo "baseline_build=repository default CMake flags (no CMAKE_BUILD_TYPE set by repository Makefile)"
            echo "comparison_build=CMAKE_C_FLAGS=-O2, with default build type unchanged to avoid automatically adding NDEBUG"
            echo "comparison_scope=LibOQS C source compile flags only; harness/AFL compiler setup otherwise unchanged"
            python3 -c 'import cffi, bitarray, sympy; print("cffi=" + cffi.__version__); print("bitarray=" + bitarray.__version__); print("sympy=" + sympy.__version__)'
            echo "--- baseline LibOQS build info ---"
            cat /tmp/baseline-build-info.txt
            echo "--- optimized LibOQS build info ---"
            cat /tmp/optimized-build-info.txt
          } > mvp/environment.txt

      - name: Run paired comparison (3 trials per variant)
        shell: bash
        run: |
          set -Eeuo pipefail

          HARNESS_DIR="$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c"

          read_stat() {
            local key="$1"
            local file="$2"
            [[ -s "$file" ]] || { printf 'NA'; return; }
            awk -F ':' -v wanted="$key" '
              {
                name = $1
                gsub(/^[ \t]+|[ \t]+$/, "", name)
                if (name == wanted) {
                  value = $2
                  gsub(/^[ \t]+|[ \t]+$/, "", value)
                  print value
                  found = 1
                  exit
                }
              }
              END { if (!found) print "NA" }
            ' "$file"
          }

          run_trial() {
            local pair="$1"
            local order="$2"
            local variant="$3"
            local trial="$4"
            local libdir
            local trial_dir
            local started_at
            local start_ns
            local end_ns
            local wall_elapsed_seconds
            local make_status
            local mutator_loaded="NO"
            local completion_marker="NO"
            local last_debug_progress="NA"
            local total_bit_positions="NA"
            local afl_reported_seconds="NA"
            local stats_snapshot_execs_done="NA"
            local saved_crashes="NA"
            local saved_hangs="NA"
            local progress_line
            local progress_done
            local stats_file

            if [[ "$variant" == "baseline" ]]; then
              libdir="cur_liboqs"
            else
              libdir="cur_liboqs_opt"
            fi

            trial_dir="$GITHUB_WORKSPACE/mvp/experiments/$variant/trial_$trial"
            mkdir -p "$trial_dir"

            echo "Preparing harness for variant=$variant trial=$trial (LibOQS=$libdir)"
            set +e
            make -C "$HARNESS_DIR" DIRNAME="$libdir" clean all 2>&1 | tee "$trial_dir/build.log"
            local build_status=${PIPESTATUS[0]}
            set -e

            if (( build_status != 0 )); then
              echo "::error::Harness build failed for $variant trial $trial."
              return 1
            fi

            rm -rf "$HARNESS_DIR/fuzzinputs" \
                   "$HARNESS_DIR/fuzzoutputs" \
                   "$HARNESS_DIR/crashes"

            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            start_ns="$(date +%s%N)"
            echo "Starting pair=$pair order=$order variant=$variant trial=$trial at $started_at"

            set +e
            (
              cd "$HARNESS_DIR"
              export DESIRED_ALG_TO_FUZZ=17
              export AFL_PYTHON_MODULE=Maul
              export AFL_CUSTOM_MUTATOR_ONLY=1
              export AFL_SKIP_CPUFREQ=1
              export AFL_DISABLE_TRIM=1
              export AFL_NO_UI=1
              export AFL_DEBUG_CHILD=1
              export AFL_INPUT_LEN_MAX=100000000
              export AFL_TESTCACHE_SIZE=200

              make run_python \
                DIRNAME="$libdir" \
                DESIRED_ALG_TO_FUZZ=17 \
                GITIMEOUT=10 \
                AFL_PYTHON_MODULE=Maul \
                AFL_CUSTOM_MUTATOR_ONLY=1 \
                AFL_SKIP_CPUFREQ=1 \
                AFL_DISABLE_TRIM=1 \
                AFL_NO_UI=1 \
                AFL_DEBUG_CHILD=1 \
                AFL_INPUT_LEN_MAX=100000000 \
                AFL_TESTCACHE_SIZE=200 \
                'FUZZCMD=env -u AFL_EXIT_WHEN_DONE -u AFL_EXIT_ON_TIME AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 $(AFLFUZZ) -i $(FUZZINPUTS)/ -o $(FUZZOUTPUTS) -V 30 -- $(BINDIR)/Match.afl.out @@'
            ) 2>&1 | tee "$trial_dir/run.log"
            make_status=${PIPESTATUS[0]}
            set -e

            end_ns="$(date +%s%N)"
            wall_elapsed_seconds="$(awk -v s="$start_ns" -v e="$end_ns" 'BEGIN { printf "%.3f", (e-s)/1000000000 }')"

            if grep -Fq "Python mutator 'Maul' installed successfully." "$trial_dir/run.log"; then
              mutator_loaded="YES"
            fi

            if grep -Fq "DEBUG: Terminating fuzzing loop." "$trial_dir/run.log"; then
              completion_marker="YES"
            fi

            progress_line="$(grep -E 'DEBUG: [0-9]+ / [0-9]+' "$trial_dir/run.log" | tail -n 1 || true)"
            if [[ -n "$progress_line" ]]; then
              progress_done="$(sed -E 's/.*DEBUG: ([0-9]+) \/ ([0-9]+).*/\1/' <<< "$progress_line")"
              total_bit_positions="$(sed -E 's/.*DEBUG: ([0-9]+) \/ ([0-9]+).*/\2/' <<< "$progress_line")"
              last_debug_progress="${progress_done}/${total_bit_positions}"
            fi

            afl_reported_seconds="$(grep -Eo 'run_time=0:00:00:[0-9]+' "$trial_dir/run.log" | tail -n 1 | awk -F: '{print $NF}' || true)"
            [[ -n "$afl_reported_seconds" ]] || afl_reported_seconds="NA"

            stats_file="$HARNESS_DIR/fuzzoutputs/default/fuzzer_stats"
            if [[ -s "$stats_file" ]]; then
              cp "$stats_file" "$trial_dir/fuzzer_stats_snapshot.txt"
              stats_snapshot_execs_done="$(read_stat execs_done "$stats_file")"
              saved_crashes="$(read_stat saved_crashes "$stats_file")"
              saved_hangs="$(read_stat saved_hangs "$stats_file")"
            fi

            printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' \
              "$pair" "$order" "$variant" "$trial" "$started_at" \
              "$wall_elapsed_seconds" "$make_status" "$mutator_loaded" \
              "$completion_marker" "$last_debug_progress" "$total_bit_positions" \
              "$afl_reported_seconds" "$stats_snapshot_execs_done" \
              "$saved_crashes" "$saved_hangs" >> "$GITHUB_WORKSPACE/mvp/timings.csv"

            if [[ "$mutator_loaded" != "YES" ]]; then
              echo "::error::Trial $variant/$trial: Maul mutator did not load."
              return 1
            fi

            if [[ "$completion_marker" != "YES" ]]; then
              echo "::error::Trial $variant/$trial: Maul completion marker was not found."
              return 1
            fi

            if [[ "$total_bit_positions" != "8720" ]]; then
              echo "::error::Trial $variant/$trial: expected 8720 mutation positions, got $total_bit_positions."
              return 1
            fi

            if [[ "$last_debug_progress" != "8000/8720" ]]; then
              echo "::error::Trial $variant/$trial: unexpected progress marker $last_debug_progress; inspect run.log."
              return 1
            fi

            if (( make_status != 0 )); then
              echo "::error::Trial $variant/$trial: make returned $make_status even though the completion marker appeared."
              return 1
            fi

            echo "Completed $variant trial $trial: wall=${wall_elapsed_seconds}s, AFL-reported=${afl_reported_seconds}s, progress=${last_debug_progress}"
          }

          # Paired order reduces bias from always running one variant first.
          # Pair 1: baseline then optimized; pair 2: optimized then baseline;
          # pair 3: baseline then optimized.
          run_trial 1 1 baseline 1
          run_trial 1 2 optimized 1
          run_trial 2 1 optimized 2
          run_trial 2 2 baseline 2
          run_trial 3 1 baseline 3
          run_trial 3 2 optimized 3

      - name: Summarize comparison
        if: always()
        shell: bash
        run: |
          if [[ -f mvp/timings.csv ]]; then
            {
              echo "### Test 7: default LibOQS vs LibOQS compiled with -O2"
              echo
              echo "Only the LibOQS C source compilation flag differs. The default build retains the repository's CMake configuration; the comparison build uses CMAKE_C_FLAGS=-O2 with the same default build type, avoiding an automatic Release/NDEBUG change. Maul.py is unchanged."
              echo
              echo '```csv'
              cat mvp/timings.csv
              echo '```'
              echo
              echo "### Wall-time summary"
              echo
              echo "| Variant | Trials | Mean (s) | Min (s) | Max (s) |"
              echo "|---|---:|---:|---:|---:|"
              awk -F, 'NR > 1 && $6 ~ /^[0-9]+([.][0-9]+)?$/ { v=$3; x=$6+0; sum[v]+=x; n[v]++; if (!(v in min) || x<min[v]) min[v]=x; if (!(v in max) || x>max[v]) max[v]=x } END { for (v in n) printf "| %s | %d | %.3f | %.3f | %.3f |\n", v, n[v], sum[v]/n[v], min[v], max[v] }' mvp/timings.csv >> "$GITHUB_STEP_SUMMARY"
            }
            cat mvp/timings.csv
          else
            echo "No timing CSV was created." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-optimization-comparison
          path: mvp/
          if-no-files-found: warn
          retention-days: 14
