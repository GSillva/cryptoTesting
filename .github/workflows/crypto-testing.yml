name: Cryptographic Testing MVP

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "LibOQS algorithm index"
        required: true
        default: "17"
        type: string

jobs:
  crypto-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          DOCKER=docker bash build.sh

      - name: Prepare output directory
        run: |
          mkdir -p mvp

            - name: Run Test 7
        id: test7
        continue-on-error: true
        run: |
          set +e

          docker run --rm \
            -e AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 \
            -v "$GITHUB_WORKSPACE/mvp:/fuzzing/tech/paper_fuzzing/liboqs/KEM/Decaps/c/mvp" \
            u18-fuzzing-crypto-image \
            bash -lc '
              make cur_liboqs &&
              cd /fuzzing/tech/paper_fuzzing/liboqs/KEM/Decaps/c &&
              DIRNAME=cur_liboqs make clean all &&
              time python3 run_all.py \
                --mutator python \
                --run_specific_alg_only ${{ inputs.algorithm }} \
                --base_path mvp
            '

          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect Test 7 output
        if: always()
        run: |
          sudo chown -R "$USER":"$USER" mvp || true

          echo "===== ARQUIVOS GERADOS ====="
          find mvp -maxdepth 5 -print | sort || true

          echo ""
          echo "===== stdout.txt ====="
          cat "mvp/${{ inputs.algorithm }}/stdout.txt" || true

          echo ""
          echo "===== fuzzoutputs ====="
          find "mvp/${{ inputs.algorithm }}/fuzzoutputs" -maxdepth 3 -print 2>/dev/null | sort || true
            '

      - name: Fix output permissions
        if: always()
        run: |
          sudo chown -R "$USER":"$USER" mvp

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-results
          path: mvp/
          if-no-files-found: warn
