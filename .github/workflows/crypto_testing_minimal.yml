
name: Cryptographic Testing - Minimal Dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/crypto_testing_minimal.yml"
      - "Makefile"
      - "tech/paper_fuzzing/liboqs/**"

permissions:
  contents: read

jobs:
  baseline:
    name: Test 7 - Minimal Dependencies (LibOQS 0.8.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            afl++ \
            build-essential \
            clang \
            cmake \
            git \
            libssl-dev \
            ninja-build \
            python3 \
            python3-bitarray \
            python3-cffi \
            python3-dev

          python3 - <<'PY'
          import cffi
          import bitarray
          print("cffi:", cffi.__version__)
          print("bitarray:", bitarray.__version__)
          PY

          # Remove the unused sympy import only in the runner workspace.
          # The tracked serialize.py and Maul.py remain unchanged.
          sed -i '/^from sympy import false$/d' \
            tech/paper_fuzzing/liboqs/serialize.py

          if grep -n '^from sympy import false$' \
            tech/paper_fuzzing/liboqs/serialize.py; then
            echo "::error::Unused sympy import was not removed."
            exit 1
          fi

      - name: Prepare AFL++ compatibility paths
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v afl-clang-fast >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang-fast)"
          elif command -v afl-clang >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-clang)"
          elif command -v afl-cc >/dev/null 2>&1; then
            AFL_CC="$(command -v afl-cc)"
          else
            echo "::error::No AFL++ compiler wrapper found."
            exit 1
          fi

          if ! command -v afl-fuzz >/dev/null 2>&1; then
            echo "::error::afl-fuzz was not found in PATH."
            exit 1
          fi

          AFL_FUZZ="$(command -v afl-fuzz)"
          mkdir -p aflpp
          ln -sfn "$AFL_CC" aflpp/afl-clang-fast
          ln -sfn "$AFL_CC" aflpp/afl-clang
          ln -sfn "$AFL_FUZZ" aflpp/afl-fuzz

          echo "AFL compiler: $AFL_CC"
          echo "AFL fuzzer: $AFL_FUZZ"

      - name: Initialize baseline records
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p mvp/trials

          printf 'trial,started_at_utc,wall_elapsed_seconds,make_exit_code,mutator_loaded,completion_marker,last_debug_progress,total_bit_positions,afl_reported_seconds,stats_snapshot_execs_done,saved_crashes,saved_hangs\n' \
            > mvp/timings.csv

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_commit=$(git rev-parse HEAD)"
            echo "branch=${GITHUB_REF_NAME:-unknown}"
            echo "runner_os=$(uname -srm)"
            echo "python=$(python3 --version 2>&1)"
            echo "clang=$(clang --version 2>&1 | head -n 1)"
            echo "afl_version=$(afl-fuzz -h 2>&1 | head -n 1 || true)"
            echo "completion_model=Maul.py intentionally signals SIGINT then SIGKILL after its finite mutation sequence; workflow validates the completion log marker instead of treating fuzzer_stats as final."
            echo "core_pattern_compat=AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1"
            echo "python_cffi=$(python3 -c 'import cffi; print(cffi.__version__)')"
            echo "python_bitarray=$(python3 -c 'import bitarray; print(bitarray.__version__)')"
            echo "--- CPU ---"
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name):' || true
          } > mvp/environment.txt

      - name: Build LibOQS 0.8.0 with minimal build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          # Avoid the repository target that installs extra packages.
          git clone --depth 1 --branch 0.8.0 \
            https://github.com/open-quantum-safe/liboqs.git cur_liboqs

          cmake -S cur_liboqs -B cur_liboqs/build -GNinja
          cmake --build cur_liboqs/build --parallel 2

          {
            echo "liboqs_directory=cur_liboqs"
            echo "liboqs_commit=$(git -C cur_liboqs rev-parse HEAD)"
            echo "liboqs_description=$(git -C cur_liboqs describe --tags --always --dirty)"
            echo "liboqs_build=cmake+ninja; no repository dependency target"
            echo "sympy=omitted; unused import removed in workspace only"
          } >> mvp/environment.txt

      - name: Build Test 7 harness
        shell: bash
        run: |
          set -Eeuo pipefail
          HARNESS_DIR="tech/paper_fuzzing/liboqs/KEM/Decaps/c"
          make -C "$HARNESS_DIR" DIRNAME=cur_liboqs clean all

      - name: Run Test 7 baseline three times
        shell: bash
        run: |
          set -Eeuo pipefail

          HARNESS_DIR="$GITHUB_WORKSPACE/tech/paper_fuzzing/liboqs/KEM/Decaps/c"

          read_stat() {
            local key="$1"
            local file="$2"
            [[ -s "$file" ]] || { printf 'NA'; return; }
            awk -F ':' -v wanted="$key" '
              {
                name = $1
                gsub(/^[ \t]+|[ \t]+$/, "", name)
                if (name == wanted) {
                  value = $2
                  gsub(/^[ \t]+|[ \t]+$/, "", value)
                  print value
                  found = 1
                  exit
                }
              }
              END { if (!found) print "NA" }
            ' "$file"
          }

          for trial in 1 2 3; do
            TRIAL_DIR="$GITHUB_WORKSPACE/mvp/trials/trial_${trial}"
            mkdir -p "$TRIAL_DIR"

            rm -rf "$HARNESS_DIR/fuzzinputs" \
                   "$HARNESS_DIR/fuzzoutputs" \
                   "$HARNESS_DIR/crashes"

            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            start_ns="$(date +%s%N)"
            echo "Starting Test 7 trial ${trial}/3 at ${started_at}"

            set +e
            (
              cd "$HARNESS_DIR"
              export DESIRED_ALG_TO_FUZZ=17
              export AFL_PYTHON_MODULE=Maul
              export AFL_CUSTOM_MUTATOR_ONLY=1
              export AFL_SKIP_CPUFREQ=1
              export AFL_DISABLE_TRIM=1
              export AFL_NO_UI=1
              export AFL_INPUT_LEN_MAX=100000000
              export AFL_TESTCACHE_SIZE=200

              make run_python \
                DESIRED_ALG_TO_FUZZ=17 \
                GITIMEOUT=10 \
                'FUZZCMD=env -u AFL_EXIT_WHEN_DONE -u AFL_EXIT_ON_TIME AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 $(AFLFUZZ) -i $(FUZZINPUTS)/ -o $(FUZZOUTPUTS) -V 30 -- $(BINDIR)/Match.afl.out @@'
            ) 2>&1 | tee "$TRIAL_DIR/run.log"
            make_status=${PIPESTATUS[0]}
            set -e

            end_ns="$(date +%s%N)"
            wall_elapsed_seconds="$(awk -v start="$start_ns" -v end="$end_ns" 'BEGIN { printf "%.3f", (end-start)/1000000000 }')"

            mutator_loaded="NO"
            completion_marker="NO"
            last_debug_progress="NA"
            total_bit_positions="NA"
            afl_reported_seconds="NA"

            if grep -Fq "Python mutator 'Maul' installed successfully." "$TRIAL_DIR/run.log"; then
              mutator_loaded="YES"
            fi

            if grep -Fq "DEBUG: Terminating fuzzing loop." "$TRIAL_DIR/run.log"; then
              completion_marker="YES"
            fi

            progress_line="$(grep -E 'DEBUG: [0-9]+ / [0-9]+' "$TRIAL_DIR/run.log" | tail -n 1 || true)"
            if [[ -n "$progress_line" ]]; then
              progress_done="$(sed -E 's/.*DEBUG: ([0-9]+) \/ ([0-9]+).*/\1/' <<< "$progress_line")"
              total_bit_positions="$(sed -E 's/.*DEBUG: ([0-9]+) \/ ([0-9]+).*/\2/' <<< "$progress_line")"
              last_debug_progress="${progress_done}/${total_bit_positions}"
            fi

            afl_runtime_line="$(grep -Eo 'run_time=0:00:00:[0-9]+' "$TRIAL_DIR/run.log" | tail -n 1 || true)"
            if [[ -n "$afl_runtime_line" ]]; then
              afl_reported_seconds="${afl_runtime_line##*:}"
            fi

            stats_file="$HARNESS_DIR/fuzzoutputs/default/fuzzer_stats"
            stats_snapshot_execs_done="NA"
            saved_crashes="NA"
            saved_hangs="NA"

            if [[ -s "$stats_file" ]]; then
              cp "$stats_file" "$TRIAL_DIR/fuzzer_stats_snapshot.txt"
              stats_snapshot_execs_done="$(read_stat execs_done "$stats_file")"
              saved_crashes="$(read_stat saved_crashes "$stats_file")"
              saved_hangs="$(read_stat saved_hangs "$stats_file")"
            fi

            printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' \
              "$trial" "$started_at" "$wall_elapsed_seconds" "$make_status" \
              "$mutator_loaded" "$completion_marker" "$last_debug_progress" \
              "$total_bit_positions" "$afl_reported_seconds" \
              "$stats_snapshot_execs_done" "$saved_crashes" "$saved_hangs" \
              >> "$GITHUB_WORKSPACE/mvp/timings.csv"

            if [[ "$mutator_loaded" != "YES" ]]; then
              echo "::error::Trial ${trial}: AFL++ did not confirm that the Maul mutator loaded."
              exit 1
            fi

            if [[ "$completion_marker" != "YES" ]]; then
              echo "::error::Trial ${trial}: expected Maul completion marker was not found."
              exit 1
            fi

            if [[ "$total_bit_positions" != "8720" ]]; then
              echo "::error::Trial ${trial}: expected total 8720, got ${total_bit_positions}."
              exit 1
            fi

            if [[ ! "$last_debug_progress" =~ ^[0-9]+/[0-9]+$ ]]; then
              echo "::error::Trial ${trial}: no mutation progress line was captured."
              exit 1
            fi

            progress_done="${last_debug_progress%%/*}"
            if (( progress_done + 1000 < total_bit_positions )); then
              echo "::error::Trial ${trial}: progress stopped too far before the expected total."
              exit 1
            fi

            if (( make_status != 0 )); then
              echo "::error::Trial ${trial}: make run_python returned ${make_status}."
              exit 1
            fi

            echo "Trial ${trial} completed: wall=${wall_elapsed_seconds}s, progress=${last_debug_progress}, AFL-reported seconds=${afl_reported_seconds}."
          done

      - name: Summarize baseline measurements
        if: always()
        shell: bash
        run: |
          if [[ -f mvp/timings.csv ]]; then
            {
              echo "### Test 7 - minimal dependency timings"
              echo
              echo "The completion marker is checked because Maul.py intentionally terminates AFL++ after its finite mutation sequence. fuzzer_stats may be only a startup snapshot."
              echo
              echo '```csv'
              cat mvp/timings.csv
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat mvp/timings.csv
          else
            echo "No timing CSV was created." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload minimal dependency results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-testing-minimal-dependencies
          path: mvp/
          if-no-files-found: warn
          retention-days: 14
